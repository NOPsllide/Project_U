name: Build Telegram Android (Armv7 Debug with ccache)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Armv7 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache_data
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "10G"
      CCACHE_SLOPPINESS: "file_macro,time_macros,include_file_mtime,include_file_ctime,locale"
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools, NDK, CMake and ccache
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache ninja-build
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529" "cmake;3.10.2.4988404"

      - name: Restore/Save ccache
        uses: actions/cache@v4
        with:
          path: .ccache_data
          key: ${{ runner.os }}-ccache-${{ hashFiles('TMessagesProj/jni/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Restore/Save Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Initialize ccache
        run: |
          mkdir -p $CCACHE_DIR
          ccache -F 0
          ccache -M 10G
          ccache -s -z

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --parallel --build-cache --stacktrace

      - name: Print ccache Performance Statistics
        run: |
          ccache -s

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Telegram-Armv7-Debug-APK
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          retention-days: 14
